<div class="job-side">
            <div class="job-alert">
              <div class="job-alert__inner">
                <h3 class="headline">Job Alerts</h3>
                <p class="subText">Register for information on future job offers</p>
                <button class="btn alert-btn">Save and register for Job Alerts</button>
              </div>
            </div>
            <div class="job-filter">
              <h3 class="headline">Your Job Search</h3>
              <div class="filter-form">
                <form>
                  <div class="form-grid">
                    <div class="f-row">
                      <div class="f-cell">
                        <fieldset>
                          <div class="form-group">
                            <label>Experience Level</label>
                            <div class="f-select" tabindex="0"><p><span class="inlineLabel">All data</span></p></div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="f-cell">
                        <fieldset>
                          <div class="form-group">
                            <label>Functional Area</label>
                            <div class="f-select" tabindex="0"><p><span class="inlineLabel">All data</span></p></div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="f-cell f-cell--more">
                        <fieldset>
                          <div class="form-group">
                            <label>Company</label>
                            <div class="f-select" tabindex="0"><p><span class="inlineLabel">All data</span></p></div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="f-cell f-cell--more">
                        <fieldset>
                          <div class="form-group">
                            <label>Country / Region*</label>
                            <div class="f-select" tabindex="0"><p><span class="inlineLabel">All data</span></p></div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="f-cell f-cell--more">
                        <fieldset>
                          <div class="form-group">
                            <label>City</label>
                            <div class="f-select" tabindex="0"><p><span class="inlineLabel">All data</span></p></div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="f-cell f-cell--more">
                        <fieldset>
                          <div class="form-group">
                            <label>Working time model</label>
                            <div class="f-select" tabindex="0"><p><span class="inlineLabel">All data</span></p></div>
                          </div>
                        </fieldset>
                      </div>
                      <div class="f-cell f-cell--full">
                        <div class="toggle-more"><span>Show more filters</span></div>
                      </div>
                      <div class="f-cell f-cell--full">
                        <div class="ses-container">
                          <div class="kw-zone">
                            <div class="input-group search">
                              <input id="search" name="search" type="search" class="kw-input" placeholder="Keywords" autocomplete="off">
                              <div class="input-group-btn"><button type="submit" class="kw-btn" aria-label="Search"></button></div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div></div>
