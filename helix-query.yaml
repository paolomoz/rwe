version: 1

indices:
  press:
    include:
      - '/en/press/rwe-*/**'
      - '/en/press/interviews/**'
      - '/en/press/statements-and-positions/**'
    exclude:
      - '/en/press/'
      - '/en/press/statements-and-positions/'
      - '/en/press/rwe-ag/'
      - '/en/press/rwe-generation/'
      - '/en/press/rwe-power/'
      - '/en/press/rwe-renewables/'
      - '/en/press/rwe-clean-energy/'
      - '/en/press/rwe-americas/'
      - '/en/press/rwe-offshore-wind-gmbh/'
      - '/en/press/rwe-renewables-europe-australia/'
      - '/en/press/rwe-supply-and-trading/'
      - '/en/press/interviews/'
      - '/en/press/contact/'
    target: /en/press/query-index.json
    properties:
      title:
        select: main h1
        value: textContent(el)
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
      publishdate:
        select: head > meta[name="publishdate"]
        value: attribute(el, 'content')
      company:
        select: head > meta[name="company"]
        value: attribute(el, 'content')
      topics:
        select: head > meta[name="topics"]
        value: attribute(el, 'content')
      teaser:
        select: head > meta[name="teaser"]
        value: attribute(el, 'content')

  ir-publications:
    include:
      - '/en/investor-relations/financial-calendar-and-publications/**'
    exclude:
      - '/en/investor-relations/financial-calendar-and-publications/'
    target: /en/investor-relations/query-index.json
    properties:
      title:
        select: main h1
        value: textContent(el)
      publishdate:
        select: head > meta[name="publishdate"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')

  stories:
    include:
      - '/en/rwe-careers-portal/teamrwe/**'
    exclude:
      - '/en/rwe-careers-portal/teamrwe/'
    target: /en/rwe-careers-portal/query-index.json
    properties:
      title:
        select: main h1
        value: textContent(el)
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      category:
        select: head > meta[name="category"]
        value: attribute(el, 'content')
      person:
        select: head > meta[name="person"]
        value: attribute(el, 'content')

  locations:
    include:
      - '/en/the-group/countries-and-locations/**'
    exclude:
      - '/en/the-group/countries-and-locations/'
    target: /en/the-group/locations-index.json
    properties:
      title:
        select: main h1
        value: textContent(el)
      image:
        select: head > meta[property="og:image"]
        value: attribute(el, 'content')
      lat:
        select: head > meta[name="lat"]
        value: attribute(el, 'content')
      long:
        select: head > meta[name="long"]
        value: attribute(el, 'content')
      country:
        select: head > meta[name="country"]
        value: attribute(el, 'content')
      technology:
        select: head > meta[name="technology"]
        value: attribute(el, 'content')
      status:
        select: head > meta[name="status"]
        value: attribute(el, 'content')
